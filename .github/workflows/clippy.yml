name: Clippy
on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  CARGO_PROFILE_DEV_DEBUG: "0" # Disable debug symbols in dev builds to speed up compilation and reduce cache size.

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bevy Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Both `net_qa` features are named (GTW-883) — see the same note in `test.yml`. A
      # package-qualified feature turns on only that package's feature, so linting the GAME's
      # `gdtf_app::dev::net_qa` and the EDITOR's `gdtf_content_editor::net_qa` needs both names.
      # No `dynamic_linking` and no `dev_tools` — CI green stays static.
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --features grimdark_turfwar/net_qa,gdtf_content_editor/net_qa -- -D warnings

      # GTW-939: the same reasoning applies to linting as to testing — see the note on the
      # matching step in `test.yml`. The feature-on code is denied the workspace lints like any
      # other code, and the step above never compiles it. PACKAGE-SCOPED for the same reason:
      # a `--workspace` run with `schema` on would put schemars in `bins/gdtf_qa_mcp`.
      - name: Run Clippy on the schema feature
        run: cargo clippy -p gdtf_qa_protocol --all-targets --features schema -- -D warnings
