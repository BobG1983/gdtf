name: CI

# Runs the STATIC CI green gate (see .claude/rules/verification.md): fmt --check,
# clippy -D warnings, and test — all WITHOUT the `dynamic_linking` feature, which
# is a dev-iteration speedup only and is never used for release artifacts. The
# static release-binary build (`cargo build -p grimdark_turfwar --release`) is NOT
# run here: it is deferred to the (much-later) packaging process. See GTW-140.
on:
  push:
    branches: [develop]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation is useless on fresh CI runners and only bloats the
  # cache; disable it so the Swatinem cache below stays small and fast.
  CARGO_INCREMENTAL: 0
  # Fail the build on any rustc/clippy warning, belt-and-suspenders with -D below.
  RUSTFLAGS: -D warnings

jobs:
  green:
    name: Static green suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build-time system deps for Bevy's Linux backends — needed to COMPILE, not
      # to open a display. CI never opens a window (MinimalPlugins tests only), but
      # the crates must still build: bevy_audio
      # needs ALSA (libasound2-dev); input/device enumeration needs udev
      # (libudev-dev); bevy_winit pulls wayland-sys, whose build script probes
      # pkg-config for wayland-client at build time (libwayland-dev provides
      # wayland-client.pc) plus xkbcommon (libxkbcommon-dev). This is Bevy's own
      # canonical Linux CI dep set — without libwayland-dev the wayland-sys build
      # script panics (pkg-config can't find wayland-client). See GTW-132.
      - name: Install Bevy Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      # The repo PINS its toolchain via rust-toolchain.toml (nightly): the
      # workspace uses nursery clippy lints (use_self, missing_const_for_fn, ...)
      # and rustfmt.toml sets unstable fmt options — both are nightly-only, so a
      # STABLE toolchain cannot run this repo's fmt/clippy green suite. We install
      # the toolchain the repo file pins (with rustfmt + clippy) so CI mirrors the
      # local dev/gate suite exactly. See report / GTW-129 for the stable conflict.
      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with rust-toolchain.toml's [toolchain].channel.
          toolchain: nightly
          components: rustfmt, clippy

      # Cache Rust build artifacts. Swatinem/rust-cache is purpose-built for Rust:
      # it caches ~/.cargo + dependency artifacts (pruning local crates so the
      # cache stays small + fast), re-saves every run, and keys on the lockfile +
      # rustc version — unlike a hand-rolled actions/cache over target/, which only
      # saves on a key miss and bloats past the 10 GB cap with a Bevy-sized target.
      # NOTE: the FIRST (cold) run still compiles all of Bevy + wgpu in the dev
      # profile (~15–30 min) — caching speeds the WARM runs. Follow-up
      # (not done here): the toolchain is unpinned `nightly` (rust-toolchain.toml +
      # dtolnay@master), so it can move between runs and invalidate the rustc-keyed
      # cache; pinning nightly to a date would stabilize it (touches local dev too).
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `cargo test --workspace` builds gdtf_test_utils (a workspace member and a
      # dev-dependency), which enables gdtf_app's `test-support` feature, so the
      # real state machine is compiled and asserted on. No extra feature flag is
      # needed here.
      - name: cargo test --workspace
        run: cargo test --workspace
