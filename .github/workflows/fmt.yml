name: Formatting

# Runs the STATIC CI green gate (see .claude/rules/verification.md): fmt --check,
# clippy -D warnings, and test — all WITHOUT the `dynamic_linking` feature, which
# is a dev-iteration speedup only and is never used for release artifacts. The
# static release-binary build (`cargo build -p grimdark_turfwar --release`) is NOT
# run here: it is deferred to the (much-later) packaging process. See GTW-140.
on:
  push:
    branches: [develop]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation is useless on fresh CI runners and only bloats the
  # cache; disable it so the Swatinem cache below stays small and fast.
  CARGO_INCREMENTAL: 0
  # Fail the build on any rustc/clippy warning, belt-and-suspenders with -D below.
  RUSTFLAGS: -D warnings
  CARGO_PROFILE_DEV_DEBUG: "0" # Disable debug symbols in dev builds to speed up compilation and reduce cache size.

jobs:
  green:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with rust-toolchain.toml's [toolchain].channel.
          toolchain: nightly
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check
