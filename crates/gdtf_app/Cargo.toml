[package]
name = "gdtf_app"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { workspace = true }
gdtf_assets = { path = "../gdtf_assets" }
gdtf_content_families = { path = "../gdtf_content_families" }
gdtf_ui = { path = "../gdtf_ui" }
gdtf_battle_sim = { path = "../gdtf_battle_sim" }
gdtf_battle_presenter = { path = "../gdtf_battle_presenter" }
gdtf_battle_input = { path = "../gdtf_battle_input" }
serde = { workspace = true }
ron = { workspace = true }
gdtf_screenshot = { path = "../gdtf_screenshot" }
gdtf_qa_protocol = { path = "../gdtf_qa_protocol" }
gdtf_net_qa_transport = { path = "../gdtf_net_qa_transport" }
gdtf_qa_command = { path = "../gdtf_qa_command" }
schemars = { workspace = true }
bevy_egui = { version = "0.41", optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
gdtf_test_utils = { path = "../gdtf_test_utils" }
gdtf_state_scoped = { path = "../gdtf_state_scoped" }
tempfile = "3"
serde_json = "1"

[features]
dynamic_linking = ["bevy/dynamic_linking"]
# Headless integration tests: strips egui-only paths where needed.
headless_test = []
file_watcher = ["bevy/file_watcher"]
dev_tools = ["dep:bevy_egui"]

[lints]
workspace = true
