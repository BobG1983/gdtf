[package]
name = "gdtf_app"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { workspace = true }
# The loose-file RON asset loader (GTW-136): `Load` registers
# `init_ron_asset::<GdtfThemeSpec>()` and loads `core_tuning/ui_theme.tuning.ron` through it.
gdtf_assets = { path = "../gdtf_assets" }
# The GTW-570 content-family glue: the per-family `ContentFamily` marker impls
# (weapons / melee / armor / fields / gangs / terrain defs / theme defs) the Load
# plugin registers through `register_content_family` — shared with the editor so
# neither host hand-stamps a folder-resolve ritual.
gdtf_content_families = { path = "../gdtf_content_families" }
gdtf_ui = { path = "../gdtf_ui" }
# The E10 sim-wiring edge (GTW-203): opens the compile-time boundary so later E10
# slices can name `gdtf_battle_sim` types. Unused here by design — this slice only
# lands the edge; E10.3/E10.4/E10.5 consume it.
gdtf_battle_sim = { path = "../gdtf_battle_sim" }
# The GTW-48 presenter edge (GTW-215): `GameBattleScapeScenePlugin` adds
# `gdtf_battle_presenter::BattlePresenterPlugin`. The presenter is the VIEW that
# mirrors the sim; this edge wires it into the app's battlescape scene.
gdtf_battle_presenter = { path = "../gdtf_battle_presenter" }
# The GTW-48 S7 input edge (GTW-221): `GameBattleScapeScenePlugin` adds
# `gdtf_battle_input::GdtfBattleInputPlugin` beside the presenter. It is the HEAD
# of the `input -> presenter -> sim` chain (it deps the presenter + the sim, the
# sim deps neither); this new `gdtf_app -> gdtf_battle_input` edge does NOT create
# a cycle (the input crate does not depend on `gdtf_app`).
gdtf_battle_input = { path = "../gdtf_battle_input" }
# The combat-log tuning table (GTW-328) is a hot-reloadable `RonAsset<CombatLogTuning>`
# loaded through the generic `gdtf_assets` loader, so the payload derives `serde::Deserialize`
# (the FX-tuning / pan-tuning `RonAsset` payload precedent).
serde = { workspace = true }
# `ron` is the PARSER the in-crate tests deserialize with (`ron::de::from_str` — the GTW-328
# combat-log tuning pin, the GTW-429 gang round-trip, the injury/attachment schema pins). The
# GTW-429 gang-editor SAVE serialization itself moved onto the shared `gdtf_assets`
# serialize/write seam in GTW-577, so no non-test code here calls `ron::ser` anymore; the dep
# stays normal because the `#[cfg(test)]` modules ride the lib target.
ron = { workspace = true }
# GTW-510: the reusable in-engine self-capture crate. OPTIONAL — pulled in ONLY by the `dev_capture`
# feature (below), matching the existing `crate::app::capture` gating discipline. Since GTW-577 the
# three scene capture hooks (gang editor / procgen visualizer / loading screen) run ON its
# primitives — `parse_shot_path` for the env-var path gate and `settle_then_capture` for the
# settle-then-`Screenshot` spawn — keeping only their per-scene env vars + drive; the game also adds
# the crate's F10 debug keybind. All under `cfg!(all(debug_assertions, feature = "dev_capture"))`,
# so a release binary never links it.
gdtf_screenshot = { path = "../gdtf_screenshot", optional = true }

[dev-dependencies]
# Dev-only cycle gdtf_app -> gdtf_test_utils -> gdtf_app is permitted by Cargo
# (dev-dependencies are not part of the normal build graph). The harness pulls
# in gdtf_app with `test-support`, which unifies that feature on for this
# crate's test target, so the integration tests can name `gdtf_app::test_support`.
gdtf_test_utils = { path = "../gdtf_test_utils" }
# GTW-575: the shared state-scoped-RESOURCE seam. Dev-only here — the scene
# scaffolds use the in-crate `states::scaffold` helpers; the integration test
# (`tests/scene_scaffold.rs`) registers a probe resource through the shared seam
# against the REAL AppState machine to pin the insert/seed/remove lifecycle.
gdtf_state_scoped = { path = "../gdtf_state_scoped" }
# The canonical shared sim test builders (GTW-324). `gdtf_app` already deps the sim
# in the NORMAL graph; this adds the `test-support` feature for the TEST target so
# integration tests name `gdtf_battle_sim::test_support`. (Feature-unification turns
# `test-support` on for the sim across the workspace test build — fine: it is test/dev
# only and the binary build enables it nowhere.)
gdtf_battle_sim = { path = "../gdtf_battle_sim", features = ["test-support"] }
# The GTW-577 `poll_then_quit` headless pin (`tests/capture_quit.rs`, `dev_capture`-gated)
# names the capture-primitive types (`CapturePath` / `CaptureProgress` / `SettleFrames` /
# `PollCap`) and chains the REAL `settle_then_capture` — the SAME path-dep instance the
# optional normal dependency resolves to, so the test drives the exact production pipeline.
gdtf_screenshot = { path = "../gdtf_screenshot" }
# GTW-621: the saved-gang regression test (`tests/gang_editor_save_loads.rs`) drives the REAL
# editor save write into a unique TempDir assets root — never into the version-controlled
# `assets/` tree — then loads it back through the real gangs folder walk. TempDir auto-cleans
# on drop (the GTW-555 terrain-save isolation precedent).
tempfile = "3"

[features]
# Enable Bevy dynamic linking for fast dev builds. Opt-in only — never enabled
# for release artifacts. Propagated from the binary crate.
dynamic_linking = ["bevy/dynamic_linking"]
# Expose the `test_support` module so an external crate can build and assert on
# the real state machine (the states + ScenesPlugin are pub(crate) otherwise).
# Test/dev only — never enabled for release artifacts or by the binary crate.
test-support = []
# DEV / LOCAL-only screenshot / visual-QA capture (GTW-297). Compiles in the
# `crate::app::capture` affordance, which is ADDITIONALLY double-gated on
# `cfg!(debug_assertions)` at the wiring site, so a release binary never sees it even
# with the feature on. `Screenshot` / `save_to_disk` live in `bevy_render` (already
# present via `DefaultPlugins`), so no extra bevy feature is required. The affordance
# is inert at runtime until `GDTF_CAPTURE_PATH` is set.
#
# NOT in the default feature set and NEVER forced into CI / test / release builds. The
# capture code is NOT compiled by the default green suite — it is built + linted
# separately with this feature on (see GTW-297's verification note).
#
# GTW-510/GTW-577: this feature ALSO pulls in the reusable `gdtf_screenshot` crate — the three
# scene capture hooks delegate their path gate (`parse_shot_path`) and their settle-then-capture
# pipeline (`settle_then_capture`) to it, and the game gains the F10 debug keybind — all still
# double-gated on `cfg!(debug_assertions)` at their wiring sites.
dev_capture = ["dep:gdtf_screenshot"]
# DEV / LOCAL-only asset hot-reload. Enables Bevy's asset file watcher: with the
# default `AssetPlugin { watch_for_changes_override: None, .. }`, Bevy starts the
# watcher iff its internal `watch` cfg is set, which `bevy/file_watcher` activates
# transitively (bevy -> bevy_internal -> bevy_asset/file_watcher -> bevy_asset/watch).
# Effect: saving a loose asset on disk (e.g. assets/core_tuning/ui_theme.tuning.ron) makes the
# AssetServer reload it and emit AssetEvent::Modified, which GTW-137's reader turns
# into a live restyle — NO source change to the AssetPlugin construction is needed.
#
# NOT in the default feature set and NEVER forced into CI / test / release builds:
# it pulls in notify-debouncer-full plus an OS filesystem-watch thread.
#
# Explicitly UN-CI-TESTED: the OS watcher is non-deterministic, so it is not part
# of the green suite. The deterministic re-derive path is covered by GTW-137's
# injected-AssetEvent tests; local on-disk hot-reload evidence is captured under
# GTW-123.
#
# Embedding-deferral note (DECISION 4, 2026-06-13): assets ship LOOSE under the
# repo-root assets/ directory; there is NO embedding now — it is deferred to
# packaging. file_watcher is meaningless on embedded assets, which is one more
# reason embedding stays deferred.
file_watcher = ["bevy/file_watcher"]

[lints]
workspace = true
