[package]
name = "gdtf_test_utils"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { workspace = true }
gdtf_app = { path = "../gdtf_app", features = ["headless_test"] }
# In [dependencies], not [dev-dependencies], so the guard test binaries under tests/ can
# name it as well as the harnesses under src/.
gdtf_assets = { path = "../gdtf_assets" }
gdtf_battle_sim = { path = "../gdtf_battle_sim" }
gdtf_content_families = { path = "../gdtf_content_families" }
gdtf_ui = { path = "../gdtf_ui" }
wgpu = "=29.0.3"

# Reads Cargo.toml as TOML in the repo-structure guards, so an equivalent spelling of the same
# key cannot fail them. Already in the lock file via bevy_macro_utils; parse-only adds nothing.
[dev-dependencies]
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }

[lints]
workspace = true
