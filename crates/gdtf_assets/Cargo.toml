[package]
name = "gdtf_assets"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
# The loader test drives a real `AssetServer` through the headless UI/asset
# harness (DefaultPlugins, backends:None), which also points `AssetPlugin` at
# the workspace-root `assets/` dir — the same source root the running app uses.
# No cycle: gdtf_test_utils -> gdtf_app -> gdtf_ui, and none depend on
# gdtf_assets, so this dev-only edge is acyclic.
gdtf_test_utils = { path = "../gdtf_test_utils" }

[lints]
workspace = true
