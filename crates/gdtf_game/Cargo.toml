[package]
name = "gdtf_game"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { workspace = true }
gdtf_assets = { path = "../gdtf_assets" }
cobalt_ron_assets = { path = "../../libs/cobalt_ron_assets" }
gdtf_content_families = { path = "../gdtf_content_families" }
gdtf_ui = { path = "../gdtf_ui" }
gdtf_battle_sim = { path = "../gdtf_battle_sim" }
gdtf_battle_presenter = { path = "../gdtf_battle_presenter" }
gdtf_battle_input = { path = "../gdtf_battle_input" }
serde = { workspace = true }
ron = { workspace = true }
cobalt_screenshot = { path = "../../libs/cobalt_screenshot", optional = true }
cobalt_mcp_protocol = { path = "../../libs/cobalt_mcp_protocol", optional = true }
cobalt_mcp_transport = { path = "../../libs/cobalt_mcp_transport", optional = true }
cobalt_mcp_command = { path = "../../libs/cobalt_mcp_command", optional = true }
bevy_egui = { version = "0.41", optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
# The mcp schedule tests look systems up by name, and without `bevy/debug`
# `System::name()` returns a placeholder instead of the real name.
bevy = { workspace = true, features = ["debug"] }
gdtf_test_utils = { path = "../gdtf_test_utils" }
cobalt_state_scoped = { path = "../../libs/cobalt_state_scoped" }
tempfile = "3"

[features]
default = []
# Everything a developer wants at once. Release is the absence of this, not a feature.
development = ["dynamic_linking", "dev_tools", "mcp", "file_watcher"]
dynamic_linking = ["bevy/dynamic_linking"]
# Headless integration tests: strips egui-only paths where needed.
headless_test = []
file_watcher = ["bevy/file_watcher"]
dev_tools = ["dep:bevy_egui"]
# The MCP host: the MCP control channel and the screenshot pipeline it drives.
mcp = [
    "dep:cobalt_screenshot",
    "dep:cobalt_mcp_protocol",
    "dep:cobalt_mcp_transport",
    "dep:cobalt_mcp_command",
]

[lints]
workspace = true
