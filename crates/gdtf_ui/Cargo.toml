[package]
name = "gdtf_ui"
version = "0.1.0"
edition = "2024"

[dependencies]
# This crate MUST NOT depend on gdtf_app / gdtf_battle_sim /
# gdtf_battle_presenter: gdtf_app depends on gdtf_ui, so any reverse edge would
# make the workspace dependency graph cyclic (and fail the build).
bevy = "0.18.1"
# Data-driven theme deps (GTW-117): `ron` parses the on-disk theme, `serde`
# (derive) drives deserialization of the `GdtfThemeSpec`. Sourced from the
# workspace's single dependency home so versions stay pinned and aligned.
ron = { workspace = true }
serde = { workspace = true }

[lints]
workspace = true
