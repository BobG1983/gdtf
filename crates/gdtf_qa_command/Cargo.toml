[package]
name = "gdtf_qa_command"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }
gdtf_qa_protocol = { path = "../gdtf_qa_protocol" }
gdtf_net_qa_transport = { path = "../gdtf_net_qa_transport" }
gdtf_screenshot = { path = "../gdtf_screenshot" }

[dev-dependencies]
# The rider tests write the PNG a shot lands as, in place of the renderer.
image = { version = "0.25", default-features = false, features = ["png"] }
# `advance_until`, the budget-free wait the rider tests take their answer from. The cycle back
# through gdtf_app is a dev-dependency, which cargo allows.
gdtf_test_utils = { path = "../gdtf_test_utils" }

[features]
dynamic_linking = [
    "bevy/dynamic_linking",
    "gdtf_net_qa_transport/dynamic_linking",
    "gdtf_screenshot/dynamic_linking",
]

[lints]
workspace = true
