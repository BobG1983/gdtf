[workspace]
members = [
    "crates/*",
    "bins/*",
]
resolver = "3"

# Single dependency home for shared, pinned third-party crates. Crates consume
# these with `pkg = { workspace = true }` so versions stay aligned across the
# workspace. `ron` + `serde` arrive here for the data-driven theme; later
# asset/config work reuses these — it does NOT re-add them.
[workspace.dependencies]
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
# `default-features = false, features = ["alloc"]` keeps WeightedIndex + the uniform
# distributions the sim draws through, while DISABLING `std_rng`/`sys_rng`/`thread_rng`
# (and their `getrandom`/OsRng entropy) — so `rand::rng()` / `OsRng` are unnameable in
# sim source by construction, hardening the entropy boundary (the scan is the
# backstop; bevy_math still pulls rand's entropy features transitively, which is fine).
rand = { version = "0.10", default-features = false, features = ["alloc"] }
# Portable, IETF-test-vector-pinned ChaCha12 RNG used as the per-subsystem RNG type.
# This is the rand-family ChaCha (rand_core 0.10 impls) — the portable
# replacement for `StdRng` (documented non-portable across rand releases). Named in
# gdtf_battle_sim source so each stream wraps a private `rand_chacha::ChaCha12Rng`.
rand_chacha = "0.10"
# Top-down 2D project: drop Bevy's `3d` default profile.
bevy = { version = "0.19.0", default-features = false, features = ["2d", "ui", "audio"] }
# Bevy's derive-macro crate ALONE (the `Deref`/`DerefMut` derives) — no engine, no
# ECS. `gdtf_qa_protocol` is the bevy-FREE wire-contract crate: it needs the
# house-style derived `Deref` for its newtypes but must NOT pull the Bevy engine, so it
# takes this proc-macro crate directly (already in `Cargo.lock` as a transitive of
# `bevy`; this makes it a direct edge for that one crate). Pinned to the workspace Bevy
# version so the derive stays in lock-step with `bevy::prelude::Deref`.
bevy_derive = "0.19.0"

[workspace.lints.rust]
missing_docs           = "deny"
unsafe_code            = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use        = "deny"
let_underscore_drop    = "deny"
unreachable_pub        = "deny"
trivial_casts          = "deny"
trivial_numeric_casts  = "deny"

[workspace.lints.clippy]
# Core groups
all         = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "deny", priority = -1 }
pedantic    = { level = "deny", priority = -1 }

# Nursery — opt-in to specific useful lints (no blanket group)
# cognitive_complexity omitted — fires on assertion-heavy tests that shouldn't be split
collection_is_never_read      = "deny"
debug_assert_with_mut_call    = "deny"
derive_partial_eq_without_eq  = "deny"
empty_line_after_doc_comments = "deny"
empty_line_after_outer_attr   = "deny"
fallible_impl_from            = "deny"
imprecise_flops               = "deny"
iter_on_empty_collections     = "deny"
iter_on_single_items          = "deny"
iter_with_drain               = "deny"
large_stack_frames            = "deny"
missing_const_for_fn          = "deny"
needless_collect              = "deny"
needless_pass_by_ref_mut      = "deny"
nonstandard_macro_braces      = "deny"
path_buf_push_overwrite       = "deny"
read_zero_byte_vec            = "deny"
redundant_clone               = "deny"
significant_drop_in_scrutinee = "deny"
significant_drop_tightening   = "deny"
string_lit_as_bytes           = "deny"
suboptimal_flops              = "deny"
suspicious_operation_groupings = "deny"
trailing_empty_array          = "deny"
trait_duplication_in_bounds   = "deny"
transmute_undefined_repr      = "deny"
trivial_regex                 = "deny"
tuple_array_conversions       = "deny"
type_repetition_in_bounds     = "deny"
uninhabited_references        = "deny"
unnecessary_struct_initialization = "deny"
unused_peekable               = "deny"
unused_rounding               = "deny"
use_self                      = "deny"

# Restriction lints — explicit opt-in
dbg_macro                       = "deny"
allow_attributes                 = "deny"  # no #[allow]; use #[expect] only
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks      = "deny"
unwrap_used                     = "deny"
expect_used                     = "deny"
panic                           = "deny"
todo                            = "deny"
unimplemented                   = "deny"

# Pedantic overrides — intentional project conventions
needless_pass_by_value  = "allow" # Bevy systems take ownership by convention
module_name_repetitions = "allow" # DashState in breaker/ is intentional domain naming
wildcard_imports        = "allow" # Project convention: globs for 4+ items from same path
cast_precision_loss       = "allow" # A lot of small f32 to u32 conversions
cast_sign_loss            = "allow" # Piercing charges, HP — small non-negative f32→u32
cast_possible_truncation  = "allow" # Piercing charges, HP — small non-negative f32→u32
implicit_hasher           = "allow" # Bevy system fns take Local<HashSet<_>> — can't be generic over BuildHasher (trait can't infer S at registration)

[workspace.lints.rustdoc]
# The WHOLE rustdoc group is fatal, not just the two link lints below.
# Before this, those two were the only rustdoc lints that could fail a doc run, so
# `cargo doc --workspace --no-deps` and `cargo doc-full` exited 0 no matter how many
# other rustdoc warnings piled up — and they piled up unobserved (24 → 32 → 37
# `redundant_explicit_links` over three measurements). `priority = -1` lets an
# individual lint named below override the group level, the same shape the clippy
# table above uses. The group covers ten lints on this toolchain, including three
# that are `allow` by default and get promoted here (`private_doc_tests`,
# `missing_crate_level_docs`, `unescaped_backticks`); a census with the whole group
# on measured ZERO firings from those three, so the promotion costs no cleanup.
# Setting the level here rather than via RUSTDOCFLAGS covers BOTH doc runs by
# construction, so the two cannot drift apart the way the alias flags did.
# Note this reaches rustdoc LINTS only — cargo's own
# "output filename collision" warning is not a lint and no level touches it; that
# one is fixed at its source by `doc = false` on the content-editor bin target.
all = { level = "deny", priority = -1 }
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# Dependencies only: smaller/faster links in dev without stripping our crates.
debug = false

[profile.release]
codegen-units = 1
lto = "thin"
