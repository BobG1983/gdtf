[package]
name = "gdtf_content_editor_bin"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "gdtf_content_editor"
path = "src/main.rs"
# GTW-929: keep this bin OUT of `cargo doc`. This bin target and the library crate
# `crates/gdtf_content_editor` share the name `gdtf_content_editor`, so both wrote
# `target/doc/gdtf_content_editor/index.html` — cargo emitted an "output filename
# collision" warning and whichever finished last silently replaced the other's
# rendered page, so a reader of the generated docs could not tell which crate they
# were reading (rust-lang/cargo#6313). `doc = false` ends the collision at its
# source: only the library renders that path now. Chosen over renaming the bin
# target because a rename would move the built path `target/debug/gdtf_content_editor`
# that `docs/tooling/agent-qa.md` documents for the editor-QA process check
# (GTW-786's evidence rule); `doc = false` changes no built path. This is a doc
# EXCLUSION, not a lint suppression — the bin is a 7-line wrapper over the library,
# whose own docs are unaffected — and the bin is still compiled, linted and built by
# every other suite step.
doc = false

[dependencies]
gdtf_content_editor = { path = "../../crates/gdtf_content_editor" }

[features]
# Bevy dynamic linking for fast dev / QA builds; chains through to gdtf_content_editor -> bevy.
# Enable for non-release builds (e.g. `cargo run -p gdtf_content_editor_bin --features dynamic_linking`);
# leave off for `--release` so it never ships in release artifacts. Mirrors the
# grimdark_turfwar binary's dynamic_linking feature wiring.
dynamic_linking = ["gdtf_content_editor/dynamic_linking"]
# GTW-533: DEV / LOCAL-only asset hot-reload; chains through to gdtf_content_editor -> bevy/file_watcher.
# Enable locally (e.g. `cargo run -p gdtf_content_editor_bin --features dynamic_linking,file_watcher`)
# to make an author's live edit of a theme / tile-role / weapon / armor / terrain / theme `.ron`
# refresh the running editor with NO restart. Leave off for CI / test / release. Mirrors the
# grimdark_turfwar binary's `file_watcher` feature wiring.
file_watcher = ["gdtf_content_editor/file_watcher"]
# GTW-878: DEV-ONLY QA network control channel for the EDITOR (the GTW-804 / GTW-805 listener);
# chains through to gdtf_content_editor -> the bevy-free wire contract (`gdtf_qa_protocol`) + the
# shared loopback transport (`gdtf_net_qa_transport`). Enable locally (e.g. `cargo run -p
# gdtf_content_editor_bin --features dynamic_linking,net_qa`, or the `edqarun` / `edqabuild`
# aliases) so a QA client can drive the running editor. The wiring site
# (`crates/gdtf_content_editor/src/app.rs`) is ADDITIONALLY double-gated on
# `cfg!(debug_assertions)` — it opens a listener — and stays inert until `GDTF_EDITOR_NET_QA` is
# set truthy, so a release editor never sees it and a normal dev launch is unaffected. Never
# enabled for release builds, and NOT enabled in CI either: this package is named
# `gdtf_content_editor_bin`, while CI's `--features ...,gdtf_content_editor/net_qa` (GTW-883)
# names the LIBRARY package `crates/gdtf_content_editor`, and a package-qualified feature only
# turns on that package's. That library feature is what gets `crates/gdtf_content_editor/src/net_qa/`
# linted and runs its two gated test binaries on every PR; this bin package's own `net_qa` stays
# off in CI. Mirrors the grimdark_turfwar binary's `net_qa` feature wiring.
net_qa = ["gdtf_content_editor/net_qa"]

[lints]
workspace = true
