[package]
name = "map_editor"
version = "0.1.0"
edition = "2024"

[dependencies]
gdtf_editor = { path = "../../crates/gdtf_editor" }

[features]
# Bevy dynamic linking for fast dev / QA builds; chains through to gdtf_editor -> bevy.
# Enable for non-release builds (e.g. `cargo run -p map_editor --features dynamic_linking`);
# leave off for `--release` so it never ships in release artifacts. Mirrors the
# grimdark_turfwar binary's dynamic_linking feature wiring.
dynamic_linking = ["gdtf_editor/dynamic_linking"]

[lints]
workspace = true
