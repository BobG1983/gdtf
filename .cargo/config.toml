[alias]
# Dynamic linking for fast iteration. Never use in release builds.
#
# Game aliases enable `dev_tools` (procgen stepper). Stepper stays off until
# the Options toggle is on. Net QA modules compile under debug_assertions only
# (no feature flag, no env arming).

# Game with dynamic linking.
drun = "run -p grimdark_turfwar --features dynamic_linking,file_watcher,dev_tools"
dbuild = "build -p grimdark_turfwar --features dynamic_linking,file_watcher,dev_tools"

# Content editor.
edrun = "run -p gdtf_content_editor_bin --features dynamic_linking,file_watcher"
edbuild = "build -p gdtf_content_editor_bin --features dynamic_linking,file_watcher"

# Workspace checks with the same feature set.
dcheck = "check --workspace --all-targets --features grimdark_turfwar/dynamic_linking,grimdark_turfwar/dev_tools"
dclippy = "clippy --workspace --all-targets --features grimdark_turfwar/dynamic_linking,grimdark_turfwar/dev_tools"
dtest = "test --workspace --features grimdark_turfwar/dynamic_linking,grimdark_turfwar/dev_tools"

# Doc check with optional-feature modules enabled (run alongside plain cargo doc).
doc-full = "doc --workspace --no-deps --features grimdark_turfwar/dev_tools"

[unstable]
checksum-freshness = true

[target.aarch64-apple-darwin]
rustflags = ["-Zshare-generics=y", "-Zthreads=0"]

[target.x86_64-apple-darwin]
rustflags = ["-Zshare-generics=y", "-Zthreads=0"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-Zshare-generics=y", "-Zthreads=0"]

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
rustdocflags = ["-Clinker=rust-lld.exe"]
rustflags = ["-Zthreads=0"]
