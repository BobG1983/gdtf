[alias]
# Dynamic linking for fast, non-release iteration.
# `dynamic_linking` is opt-in and must NEVER be enabled for release builds.
#
# GTW-655: every GAME dev alias below (`drun` / `dbuild`) and every workspace-wide check
# (`dcheck` / `dclippy` / `dtest`) also enables `dev_tools` (the procgen load-time stepper's
# egui overlay), so the dev/gate loop always compiles, lints, and tests the stepper's
# drive/gate/command/summary logic — the non-egui majority of it, including the pure
# stage-summary formatter (`gdtf_app`'s `dev::procgen_stepper::summary`). Only the egui draw
# closure itself (`ui.rs`'s panel) needs a primary window, so it is compiled only by `dbuild`
# (the same screenshot-QA-territory carve-out as the content editor's own egui closure — see
# `.claude/rules/bevy-traps.md` #8; details in `docs/testing.md`). The stepper stays DISENGAGED
# at runtime (no behavior change) until a developer turns on the dev-only procgen-stepper toggle
# on the Options screen (default OFF, GTW-868) — see `crate::dev::procgen_stepper` in `gdtf_app`.
# CI's static suite does not enable `dynamic_linking` or `dev_tools`.
#
# GTW-736: those same aliases ALSO enable `net_qa` (the DEV-ONLY QA network control channel,
# the GTW-694 architecture's T3), mirroring the `dev_tools` threading above, so the dev/gate
# loop always compiles, lints, and tests the loopback transport + request router. It stays
# inert at runtime unless `GDTF_NET_QA` is set truthy (its `from_env` gate) AND is additionally
# `cfg!(debug_assertions)`-gated at its wiring site (it opens a listener). CI's static suite does
# not enable `dynamic_linking`; it DOES enable both `net_qa` features since GTW-883, on its clippy
# and test steps (`.github/workflows/clippy.yml`, `test.yml`).
#
# GTW-877: the three workspace-wide aliases (`dcheck` / `dclippy` / `dtest`) and `doc-full` ALSO
# enable `gdtf_content_editor/net_qa` — the EDITOR's own QA control channel (GTW-804 / GTW-805).
# `grimdark_turfwar/net_qa` reaches only the GAME's `gdtf_app::dev::net_qa`; nothing enabled the
# editor's, so its entire `src/net_qa/` module and its two `#![cfg(all(debug_assertions, feature =
# "net_qa"))]` test binaries (`tests/net_qa_hello/`, `tests/net_qa_editor_query/`) were compiled,
# linted, doc-checked and run by NOTHING in the gate — both reported "0 tests". Naming the feature
# on the SAME runs (rather than adding new ones) costs no extra bevy build: these runs already
# compile the editor crate and both optional deps (`gdtf_qa_protocol`, `gdtf_net_qa_transport`).
#
# GTW-878 CORRECTS what GTW-877 wrote here. That note said the editor's listener "stays exactly as
# dev-gated as it was — the editor BINARY crate has no passthrough for this feature, so a release
# editor build still cannot turn it on". The first half was the point; the second half described a
# GAP, not a safeguard. `bins/gdtf_content_editor/Cargo.toml` now declares
# `net_qa = ["gdtf_content_editor/net_qa"]`, exactly as `bins/grimdark_turfwar/Cargo.toml` declares
# `net_qa = ["gdtf_app/net_qa"]`, so `cargo run -p gdtf_content_editor_bin --features
# dynamic_linking,net_qa` (the `edqarun` alias below) launches a real editor that opens the port.
# The listener is STILL dev-only, and for the reasons that always did the work: the feature is
# opt-in (never in the default set, never named for a release build), its wiring site is
# `cfg(all(debug_assertions, feature = "net_qa"))`, and even a `net_qa` debug editor stays inert
# until `GDTF_EDITOR_NET_QA` is set truthy. A conformance test
# (`crates/gdtf_test_utils/tests/binary_feature_passthrough/`) pins both binaries' declarations.

# Run / build the game with dynamic linking.
drun = "run -p grimdark_turfwar --features dynamic_linking,file_watcher,dev_tools,net_qa"
dbuild = "build -p grimdark_turfwar --features dynamic_linking,file_watcher,dev_tools,net_qa"

# Run / build the content editor (bins/gdtf_content_editor) with dynamic linking.
# These two deliberately stay MINIMAL: no `net_qa` (a plain dev editor should not pay that
# feature's compile cost — use `edqarun` / `edqabuild` below when you want the QA port), and no
# `dev_tools`, which is a `grimdark_turfwar` feature the editor binary does not depend on.
edrun = "run -p gdtf_content_editor_bin --features dynamic_linking"
edbuild = "build -p gdtf_content_editor_bin --features dynamic_linking"

# GTW-878: run / build the content editor WITH its DEV-ONLY QA control channel compiled in. The
# feature names are the BINARY package's own (`bins/gdtf_content_editor/Cargo.toml`), which chain
# to `gdtf_content_editor/net_qa`. Compiling it in is not the same as switching it on: the editor
# still opens no port until `GDTF_EDITOR_NET_QA` is truthy, and the port is `GDTF_EDITOR_NET_QA_PORT`
# (default `7617`). Recipe: `GDTF_EDITOR_NET_QA=1 GDTF_EDITOR_NET_QA_PORT=7617 cargo edqarun` —
# see `docs/tooling/agent-qa.md`. Never for release.
edqarun = "run -p gdtf_content_editor_bin --features dynamic_linking,net_qa"
edqabuild = "build -p gdtf_content_editor_bin --features dynamic_linking,net_qa"

# Workspace-wide dev checks with dynamic linking.
dcheck = "check --workspace --all-targets --features grimdark_turfwar/dynamic_linking,grimdark_turfwar/dev_tools,grimdark_turfwar/net_qa,gdtf_content_editor/net_qa"
dclippy = "clippy --workspace --all-targets --features grimdark_turfwar/dynamic_linking,grimdark_turfwar/dev_tools,grimdark_turfwar/net_qa,gdtf_content_editor/net_qa"
dtest = "test --workspace --features grimdark_turfwar/dynamic_linking,grimdark_turfwar/dev_tools,grimdark_turfwar/net_qa,gdtf_content_editor/net_qa"

# GTW-790: the with-features doc-link check. The green suite's plain `cargo doc --workspace
# --no-deps` runs with DEFAULT features, so the `dev_tools` / `net_qa`-gated modules are never
# compiled and their doc comments are never link-checked — a `broken_intra_doc_links` /
# `private_intra_doc_links` regression inside them (both denied workspace-wide) slips past the
# gate and CI. This alias enables those two features so `cargo doc` checks those modules too;
# run it ALONGSIDE the default doc step, not instead of it (the same both-configs rule the
# `dclippy` dual gate follows: an optional-feature module must be checked WITH its feature on,
# not just off). No `dynamic_linking` — rustdoc never links the binary, so it would only add
# cold-build cost for no lint gain. GTW-877 added `gdtf_content_editor/net_qa` for the same
# reason: the editor's `src/net_qa/` doc comments were never link-checked either.
doc-full = "doc --workspace --no-deps --features grimdark_turfwar/dev_tools,grimdark_turfwar/net_qa,gdtf_content_editor/net_qa"

[unstable]
checksum-freshness = true

[target.aarch64-apple-darwin]
rustflags = ["-Zshare-generics=y", "-Zthreads=0"]

[target.x86_64-apple-darwin]
rustflags = ["-Zshare-generics=y", "-Zthreads=0"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-Zshare-generics=y", "-Zthreads=0"]

[target.x86_64-pc-windows-msvc]
# LLD linker
#
# You may need to install it:
#
# ```
# cargo install -f cargo-binutils
# rustup component add llvm-tools
# ```
linker = "rust-lld.exe"
rustdocflags = ["-Clinker=rust-lld.exe"]
rustflags = ["-Zthreads=0"]
