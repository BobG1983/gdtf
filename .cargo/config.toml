[alias]
# Dynamic linking for fast, non-release iteration.
# `dynamic_linking` is opt-in and must NEVER be enabled for release builds.
#
# Every GAME dev alias below (`drun` / `dbuild`) and every workspace-wide check
# (`dcheck` / `dclippy` / `dtest`) also enables `dev_tools` (the procgen load-time
# stepper's egui overlay), so the dev/gate loop always compiles, lints, and tests
# the stepper's drive/gate/command/summary logic — the non-egui majority of it,
# including the pure stage-summary formatter (`gdtf_app`'s
# `dev::procgen_stepper::summary`). Only the egui draw closure itself (`ui.rs`'s
# panel) needs a primary window, so it is compiled only by `dbuild` (the same
# screenshot-QA carve-out as the content editor's own egui closure — see
# `.claude/rules/bevy-traps.md` #8; details in `docs/testing.md`). The stepper
# stays DISENGAGED at runtime until a developer turns on the dev-only
# procgen-stepper toggle on the Options screen (default OFF) — see
# `crate::dev::procgen_stepper` in `gdtf_app`. CI's static suite does not enable
# `dynamic_linking` or `dev_tools`.
#
# Those same aliases ALSO enable `net_qa` (the DEV-ONLY QA network control
# channel), mirroring the `dev_tools` threading above, so the dev/gate loop always
# compiles, lints, and tests the loopback transport + request router. It stays
# inert at runtime unless `GDTF_NET_QA` is set truthy (its `from_env` gate) AND is
# additionally `cfg!(debug_assertions)`-gated at its wiring site (it opens a
# listener). CI's static suite does not enable `dynamic_linking`; it DOES enable
# both `net_qa` features on its clippy and test steps (`.github/workflows/clippy.yml`,
# `test.yml`).
#
# The three workspace-wide aliases (`dcheck` / `dclippy` / `dtest`) and `doc-full`
# ALSO enable `gdtf_content_editor/net_qa` — the EDITOR's own QA control channel.
# `grimdark_turfwar/net_qa` reaches only the GAME's `gdtf_app::dev::net_qa`; without
# naming the editor's feature, its entire `src/net_qa/` module and its two
# `#![cfg(all(debug_assertions, feature = "net_qa"))]` test binaries
# (`tests/net_qa_hello/`, `tests/net_qa_editor_query/`) would be compiled, linted,
# doc-checked and run by NOTHING in the gate. Naming the feature on the SAME runs
# (rather than adding new ones) costs no extra bevy build: these runs already
# compile the editor crate and both optional deps (`gdtf_qa_protocol`,
# `gdtf_net_qa_transport`).
#
# `bins/gdtf_content_editor/Cargo.toml` declares `net_qa = ["gdtf_content_editor/net_qa"]`,
# exactly as `bins/grimdark_turfwar/Cargo.toml` declares `net_qa = ["gdtf_app/net_qa"]`,
# so `cargo run -p gdtf_content_editor_bin --features dynamic_linking,net_qa` (the
# `edqarun` alias below) launches a real editor that opens the port. The listener is
# still dev-only: the feature is opt-in (never in the default set, never named for a
# release build), its wiring site is `cfg(all(debug_assertions, feature = "net_qa"))`,
# and even a `net_qa` debug editor stays inert until `GDTF_EDITOR_NET_QA` is set truthy.
# A conformance test (`crates/gdtf_test_utils/tests/binary_feature_passthrough/`) pins
# both binaries' declarations.

# Run / build the game with dynamic linking.
drun = "run -p grimdark_turfwar --features dynamic_linking,file_watcher,dev_tools,net_qa"
dbuild = "build -p grimdark_turfwar --features dynamic_linking,file_watcher,dev_tools,net_qa"

# Run / build the content editor (bins/gdtf_content_editor) with dynamic linking.
# These two deliberately stay MINIMAL: no `net_qa` (a plain dev editor should not pay that
# feature's compile cost — use `edqarun` / `edqabuild` below when you want the QA port), and no
# `dev_tools`, which is a `grimdark_turfwar` feature the editor binary does not depend on.
edrun = "run -p gdtf_content_editor_bin --features dynamic_linking"
edbuild = "build -p gdtf_content_editor_bin --features dynamic_linking"

# Run / build the content editor WITH its DEV-ONLY QA control channel compiled in. The
# feature names are the BINARY package's own (`bins/gdtf_content_editor/Cargo.toml`), which chain
# to `gdtf_content_editor/net_qa`. Compiling it in is not the same as switching it on: the editor
# still opens no port until `GDTF_EDITOR_NET_QA` is truthy, and the port is `GDTF_EDITOR_NET_QA_PORT`
# (default `7617`). Recipe: `GDTF_EDITOR_NET_QA=1 GDTF_EDITOR_NET_QA_PORT=7617 cargo edqarun` —
# see `docs/tooling/agent-qa.md`. Never for release.
edqarun = "run -p gdtf_content_editor_bin --features dynamic_linking,net_qa"
edqabuild = "build -p gdtf_content_editor_bin --features dynamic_linking,net_qa"

# Workspace-wide dev checks with dynamic linking.
dcheck = "check --workspace --all-targets --features grimdark_turfwar/dynamic_linking,grimdark_turfwar/dev_tools,grimdark_turfwar/net_qa,gdtf_content_editor/net_qa"
dclippy = "clippy --workspace --all-targets --features grimdark_turfwar/dynamic_linking,grimdark_turfwar/dev_tools,grimdark_turfwar/net_qa,gdtf_content_editor/net_qa"
dtest = "test --workspace --features grimdark_turfwar/dynamic_linking,grimdark_turfwar/dev_tools,grimdark_turfwar/net_qa,gdtf_content_editor/net_qa"

# With-features doc-link check. The green suite's plain `cargo doc --workspace --no-deps`
# runs with DEFAULT features, so the `dev_tools` / `net_qa`-gated modules are never compiled
# and their doc comments are never link-checked — a `broken_intra_doc_links` /
# `private_intra_doc_links` regression inside them (both denied workspace-wide) slips past the
# gate and CI. This alias enables those features so `cargo doc` checks those modules too;
# run it ALONGSIDE the default doc step, not instead of it (the same both-configs rule the
# `dclippy` dual gate follows: an optional-feature module must be checked WITH its feature on,
# not just off). No `dynamic_linking` — rustdoc never links the binary, so it would only add
# cold-build cost for no lint gain. `gdtf_content_editor/net_qa` is named for the same reason:
# the editor's `src/net_qa/` doc comments need link-checking too.
doc-full = "doc --workspace --no-deps --features grimdark_turfwar/dev_tools,grimdark_turfwar/net_qa,gdtf_content_editor/net_qa"

# The `gdtf_qa_protocol` `schema` feature, checked WITH the feature on. The crate's
# `schemars` dependency is optional; the `#[cfg_attr(feature = "schema", derive(...))]` lines
# across `src/ids/` and the whole `src/ids/test/schema.rs` module are reachable only through it.
# Nothing above turns it on, so without these two aliases those lines could be deleted and all
# six green-suite commands would still pass — the same both-configs gap closed for the game and
# the editor above.
#
# PACKAGE-SCOPED (`-p gdtf_qa_protocol`) on purpose, NOT added to the `--workspace` feature lists
# above. Cargo builds ONE `gdtf_qa_protocol` library unit per invocation, so naming
# `gdtf_qa_protocol/schema` on a `--workspace` command would unify schemars into every consumer
# including `bins/gdtf_qa_mcp` — the courier carries schema documents as opaque text and must
# never link a schema library. `-p gdtf_qa_protocol` never builds the courier at all.
# `crates/gdtf_qa_protocol/tests/engine_free.rs` pins that: it fails if any `--workspace` line in
# this file or in a workflow names the feature.
clippy-schema = "clippy -p gdtf_qa_protocol --all-targets --features schema"
test-schema = "test -p gdtf_qa_protocol --features schema"

[unstable]
checksum-freshness = true

[target.aarch64-apple-darwin]
rustflags = ["-Zshare-generics=y", "-Zthreads=0"]

[target.x86_64-apple-darwin]
rustflags = ["-Zshare-generics=y", "-Zthreads=0"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-Zshare-generics=y", "-Zthreads=0"]

[target.x86_64-pc-windows-msvc]
# LLD linker
#
# You may need to install it:
#
# ```
# cargo install -f cargo-binutils
# rustup component add llvm-tools
# ```
linker = "rust-lld.exe"
rustdocflags = ["-Clinker=rust-lld.exe"]
rustflags = ["-Zthreads=0"]
