[alias]
# Dynamic linking for fast, non-release iteration.
# `dynamic_linking` is opt-in and must NEVER be enabled for release builds.

# Run / build the game with dynamic linking.
drun = "run -p grimdark_turfwar --features dynamic_linking,file_watcher"
dbuild = "build -p grimdark_turfwar --features dynamic_linking,file_watcher"

# Run / build the map editor (bins/map_editor) with dynamic linking.
edrun = "run -p map_editor --features dynamic_linking"
edbuild = "build -p map_editor --features dynamic_linking"

# Workspace-wide dev checks with dynamic linking. 
dcheck = "check --workspace --all-targets --features grimdark_turfwar/dynamic_linking"
dclippy = "clippy --workspace --all-targets --features grimdark_turfwar/dynamic_linking"
dtest = "test --workspace --features grimdark_turfwar/dynamic_linking"

[unstable]
checksum-freshness = true

[target.aarch64-apple-darwin]
rustflags = ["-Zshare-generics=y", "-Zthreads=0"]

[target.x86_64-apple-darwin]
rustflags = ["-Zshare-generics=y", "-Zthreads=0"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-Zshare-generics=y", "-Zthreads=0"]

[target.x86_64-pc-windows-msvc]
# LLD linker
#
# You may need to install it:
#
# ```
# cargo install -f cargo-binutils
# rustup component add llvm-tools
# ```
linker = "rust-lld.exe"
rustdocflags = ["-Clinker=rust-lld.exe"]
rustflags = ["-Zthreads=0"]
