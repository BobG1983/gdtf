[alias]
# Dynamic linking for fast, non-release iteration.
# `dynamic_linking` is opt-in and must NEVER be enabled for release builds.

# Run / build the game with dynamic linking.
drun = "run -p grimdark_turfwar --features dynamic_linking"
dbuild = "build -p grimdark_turfwar --features dynamic_linking"

# Workspace-wide dev checks with dynamic linking. bevy is a single shared
# dependency, so enabling the feature anywhere makes every bevy-linked crate
# use the shared dylib — these cover all crates (incl. libs).
dcheck = "check --workspace --all-targets --features grimdark_turfwar/dynamic_linking"
dclippy = "clippy --workspace --all-targets --features grimdark_turfwar/dynamic_linking"
dtest = "test --workspace --features grimdark_turfwar/dynamic_linking"
