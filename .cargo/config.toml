[alias]
# `development` is the umbrella dev feature on each binary package: dynamic linking, the
# dev tools, the QA host and the asset file watcher. Release is the absence of it.

# Game with dynamic linking.
drun = "run -p game --features development"
dbuild = "build -p game --features development"

# Content editor.
edrun = "run -p editor --features development"
edbuild = "build -p editor --features development"

# Workspace checks. Both packages' `development` so the QA host compiles on both sides.
dcheck = "check --workspace --all-targets --features game/development,editor/development"
dclippy = "clippy --workspace --all-targets --features game/development,editor/development"
dtest = "test --workspace --features game/development,editor/development"

# Release builds carrying only the QA host, so a release-only bug can be driven.
mcpbuild = "build --release -p game --features mcp"
edmcpbuild = "build --release -p editor --features mcp"

# Doc check with optional-feature modules enabled (run alongside plain cargo doc).
doc-full = "doc --workspace --no-deps --features game/development,editor/development"

[unstable]
checksum-freshness = true

[target.aarch64-apple-darwin]
rustflags = ["-Zshare-generics=y", "-Zthreads=0"]

[target.x86_64-apple-darwin]
rustflags = ["-Zshare-generics=y", "-Zthreads=0"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-Zshare-generics=y", "-Zthreads=0"]

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
rustdocflags = ["-Clinker=rust-lld.exe"]
rustflags = ["-Zthreads=0"]
